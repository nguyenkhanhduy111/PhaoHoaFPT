<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ước Nguyện Pháo Hoa 🎆</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: #020510;
  font-family: 'Segoe UI', system-ui, sans-serif;
  cursor: none;
}

canvas#bg { position:fixed; inset:0; z-index:0; }

/* UI Controls */
.controls {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  gap: 12px;
  align-items: center;
  opacity: 0;
  transition: opacity 0.3s;
}

body:hover .controls { opacity: 1; }

.btn {
  padding: 10px 22px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(0,0,0,0.6);
  color: rgba(255,255,255,0.85);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: background 0.2s;
}

.btn:hover { background: rgba(255,255,255,0.15); }
.btn.primary { background: rgba(255,107,157,0.4); border-color: rgba(255,107,157,0.6); }

.counter {
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  backdrop-filter: blur(10px);
}

/* Wish card - center spotlight */
.wish-card {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 50;
  text-align: center;
  max-width: min(520px, 88vw);
  width: 100%;
  pointer-events: none;
  transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s;
  opacity: 0;
}

.wish-card.show {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.wish-card.hide {
  transform: translate(-50%, -50%) scale(0.8);
  opacity: 0;
}

.wish-avatar {
  width: 100px; height: 100px;
  border-radius: 50%;
  margin: 0 auto 14px;
  border: 3px solid rgba(255,215,0,0.7);
  background: rgba(255,255,255,0.1);
  overflow: hidden;
  box-shadow: 0 0 30px rgba(255,215,0,0.4), 0 0 60px rgba(255,215,0,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
}

.wish-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
}

.wish-name {
  font-size: clamp(18px, 3.5vw, 26px);
  font-weight: 700;
  color: #FFD700;
  text-shadow: 0 0 20px rgba(255,215,0,0.8);
  margin-bottom: 10px;
}

.wish-bubble {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px;
  padding: 18px 24px;
  backdrop-filter: blur(12px);
}

.wish-text {
  font-size: clamp(15px, 2.8vw, 21px);
  color: #fff;
  line-height: 1.6;
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
}

/* Background wishes */
.bg-wish {
  position: fixed;
  pointer-events: none;
  z-index: 10;
  text-align: center;
  transition: opacity 1s;
  animation: floatUp 8s ease-in-out forwards;
}

.bg-wish .bg-name { font-size: 11px; color: rgba(255,215,0,0.5); font-weight: 600; }
.bg-wish .bg-text { font-size: 10px; color: rgba(255,255,255,0.35); max-width: 130px; line-height: 1.3; }
.bg-wish .bg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  margin: 0 auto 4px;
  border: 1.5px solid rgba(255,215,0,0.3);
  overflow: hidden; background: rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.bg-wish .bg-avatar img { width:100%; height:100%; object-fit:cover; }

@keyframes floatUp {
  0%   { opacity:0; transform: translateY(20px) scale(0.8); }
  15%  { opacity:1; }
  80%  { opacity:0.6; }
  100% { opacity:0; transform: translateY(-60px) scale(1); }
}

/* Replay progress bar */
.replay-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  display: none;
  flex-direction: column;
}
.replay-bar.active { display: flex; }
.replay-track { height: 3px; background: rgba(255,255,255,0.1); }
.replay-fill {
  height: 100%;
  background: linear-gradient(90deg, #FFD700, #FF6B9D);
  width: 0%;
  transition: width 0.3s ease;
}
.replay-info {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  padding: 8px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.replay-label { font-size: 13px; color: rgba(255,215,0,0.9); }
.replay-stop {
  padding: 4px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.replay-stop:hover { background: rgba(255,80,80,0.3); border-color: rgba(255,80,80,0.5); color: #fff; }

/* Fullscreen tip */
.fs-tip {
  position: fixed; top: 18px; right: 18px;
  z-index: 100;
  font-size: 12px;
  color: rgba(255,255,255,0.25);
  opacity: 0;
  transition: opacity 0.3s;
}
body:hover .fs-tip { opacity: 1; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- Replay progress bar -->
<div class="replay-bar" id="replayBar">
  <div class="replay-info">
    <span class="replay-label" id="replayLabel">🎇 Đang phát lại...</span>
    <button class="replay-stop" onclick="stopReplay()">✕ Dừng phát lại</button>
  </div>
  <div class="replay-track"><div class="replay-fill" id="replayFill"></div></div>
</div>

<div class="wish-card" id="wishCard">
  <div class="wish-avatar" id="cardAvatar">🌟</div>
  <div class="wish-name"  id="cardName"></div>
  <div class="wish-bubble">
    <div class="wish-text" id="cardWish"></div>
  </div>
</div>

<div class="controls">
  <div class="counter" id="counter">0 điều ước</div>
  <button class="btn" onclick="togglePause()" id="pauseBtn">⏸ Tạm dừng</button>
  <button class="btn primary" onclick="replayAll()" id="replayBtn">🎇 Bắn lại điều ước</button>
  <button class="btn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
</div>

<div class="fs-tip">Nhấn F11 để toàn màn hình</div>

<script>
// ── Canvas & Fireworks ──────────────────────────────────────────────
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Stars
const stars = Array.from({length: 200}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.5 + 0.3,
  a: Math.random(),
  da: (Math.random() - 0.5) * 0.01
}));

// Particles
const particles = [];

class Particle {
  constructor(x, y, color) {
    this.x  = x; this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life    = 1;
    this.decay   = Math.random() * 0.015 + 0.008;
    this.radius  = Math.random() * 3 + 1.5;
    this.gravity = 0.08;
    this.trail   = [];
  }
  update() {
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 6) this.trail.shift();
    this.vx *= 0.97;
    this.vy  = this.vy * 0.97 + this.gravity;
    this.x  += this.vx;
    this.y  += this.vy;
    this.life -= this.decay;
  }
  draw() {
    ctx.save();
    // Trail
    for (let i = 0; i < this.trail.length - 1; i++) {
      const t0 = this.trail[i], t1 = this.trail[i+1];
      const a  = (i / this.trail.length) * this.life * 0.4;
      ctx.strokeStyle = this.color.replace('1)', a + ')');
      ctx.lineWidth   = this.radius * 0.5;
      ctx.beginPath(); ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.stroke();
    }
    // Glow
    ctx.shadowBlur  = 8;
    ctx.shadowColor = this.color.replace('1)', '0.8)');
    ctx.fillStyle   = this.color.replace('1)', this.life + ')');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// Firework colors
const FW_COLORS = [
  'rgba(255,215,0,1)',   // gold
  'rgba(255,107,157,1)', // pink
  'rgba(100,200,255,1)', // blue
  'rgba(180,100,255,1)', // purple
  'rgba(100,255,180,1)', // green
  'rgba(255,160,50,1)',  // orange
  'rgba(255,80,80,1)',   // red
];

// Rockets
const rockets = [];

class Rocket {
  constructor(targetX, targetY, color, onExplode) {
    this.x  = targetX + (Math.random() - 0.5) * 80;
    this.y  = canvas.height + 10;
    this.tx = targetX;
    this.ty = targetY;
    this.color     = color;
    this.onExplode = onExplode;
    this.speed     = 12 + Math.random() * 4;
    this.exploded  = false;
    this.trail     = [];
  }
  update() {
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 12) this.trail.shift();
    const dx = this.tx - this.x, dy = this.ty - this.y;
    const dist = Math.hypot(dx, dy);
    if (dist < this.speed) {
      this.explode(); return false;
    }
    this.x += (dx/dist) * this.speed;
    this.y += (dy/dist) * this.speed;
    return true;
  }
  explode() {
    if (this.exploded) return;
    this.exploded = true;
    const count = 120 + Math.floor(Math.random() * 60);
    for (let i = 0; i < count; i++) particles.push(new Particle(this.x, this.y, this.color));
    // Sparkle burst
    for (let i = 0; i < 30; i++) {
      const p = new Particle(this.x, this.y, 'rgba(255,255,255,1)');
      p.decay  *= 1.5;
      p.vx     *= 1.5;
      p.vy     *= 1.5;
      p.radius *= 0.6;
      particles.push(p);
    }
    if (this.onExplode) this.onExplode(this.x, this.y);
  }
  draw() {
    ctx.save();
    for (let i = 0; i < this.trail.length - 1; i++) {
      const a = (i / this.trail.length) * 0.6;
      ctx.strokeStyle = this.color.replace('1)', a + ')');
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.moveTo(this.trail[i].x, this.trail[i].y);
      ctx.lineTo(this.trail[i+1].x, this.trail[i+1].y);
      ctx.stroke();
    }
    ctx.shadowBlur  = 12;
    ctx.shadowColor = this.color.replace('1)', '0.9)');
    ctx.fillStyle   = '#fff';
    ctx.beginPath(); ctx.arc(this.x, this.y, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// Ambient random fireworks
function ambientFirework() {
  const x = canvas.width  * (0.15 + Math.random() * 0.7);
  const y = canvas.height * (0.1  + Math.random() * 0.45);
  const c = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
  rockets.push(new Rocket(x, y, c, null));
}

// Main loop
function loop() {
  // Fade
  ctx.fillStyle = 'rgba(2,5,16,0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  stars.forEach(s => {
    s.a += s.da;
    if (s.a > 1 || s.a < 0.1) s.da *= -1;
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI*2);
    ctx.fill();
  });

  // Rockets
  for (let i = rockets.length - 1; i >= 0; i--) {
    if (!rockets[i].update()) rockets.splice(i, 1);
    else rockets[i].draw();
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    if (particles[i].life <= 0) particles.splice(i, 1);
    else particles[i].draw();
  }

  requestAnimationFrame(loop);
}
loop();

// Ambient timer
let ambientTimer = null;
function startAmbient() {
  ambientTimer = setInterval(() => {
    if (!paused) ambientFirework();
  }, 1800);
}
startAmbient();

// ── Data & Queue ──────────────────────────────────────────────────
const API_URL  = '/api';
const POLL_MS  = 8000;
const SHOW_MS  = 2000; // ms hiển thị mỗi card

let wishes    = [];
let shownIds  = new Set();
let queue     = [];
let showing   = false;  // đang trong launchWish hay không
let paused    = false;
let pollTimer = null;

// Replay state
let replayActive = false;
let replayTotal  = 0;
let replayIndex  = 0;
let replayQueue  = [];  // bản sao riêng cho replay, không dùng chung queue

async function fetchWishes() {
  try {
    const res  = await fetch(API_URL + '?t=' + Date.now());
    const data = await res.json();
    if (!data.wishes) return;

    const prev = wishes.length;
    wishes = data.wishes;
    document.getElementById('counter').textContent = wishes.length + ' điều ước';

    wishes.forEach(w => {
      if (!shownIds.has(w.id)) {
        shownIds.add(w.id);
        if (prev > 0 && !replayActive) queue.push(w);
      }
    });

    if (prev === 0 && wishes.length > 0) {
      const seed = wishes.slice(-3);
      seed.forEach(w => { shownIds.add(w.id); queue.push(w); });
    }

    if (!showing && !replayActive) processQueue();
  } catch(e) {}
}

// ── Queue tuần tự: xong hẳn rồi mới bắn tiếp ─────────────────────
function processQueue() {
  if (paused || showing || queue.length === 0) {
    if (queue.length === 0) showing = false;
    return;
  }
  showing = true;
  const w = queue.shift();
  launchWish(w, () => {
    showing = false;
    // Chờ thêm 600ms cho card ẩn xong rồi mới bắn tiếp
    setTimeout(processQueue, 600);
  });
}

// ── Replay tuần tự: dùng index riêng, Promise chain ───────────────
async function runReplay() {
  for (let i = 0; i < replayQueue.length; i++) {
    if (!replayActive) break; // bị dừng giữa chừng

    replayIndex = i;
    updateReplayBar(i, replayQueue.length);

    await new Promise(resolve => {
      launchWish(replayQueue[i], resolve);
    });

    // Chờ card ẩn hoàn toàn trước khi bắn tiếp
    await sleep(300);
  }
  stopReplay();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function updateReplayBar(current, total) {
  const pct = total > 1 ? Math.round((current / (total - 1)) * 100) : 100;
  document.getElementById('replayFill').style.width  = pct + '%';
  document.getElementById('replayLabel').textContent =
    '🎇 Phát lại ' + (current + 1) + ' / ' + total;
}

// ── launchWish: bắn pháo hoa + hiển thị card, gọi onDone khi xong ─
function launchWish(w, onDone) {
  const cx    = canvas.width  * 0.5;
  const cy    = canvas.height * 0.38;
  const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];

  const r = new Rocket(cx, cy, color, () => {
    showWishCard(w, color);

    setTimeout(() => {
      for (let i = 0; i < 3; i++) {
        rockets.push(new Rocket(
          cx + (Math.random() - 0.5) * 200,
          cy + (Math.random() - 0.5) * 150,
          FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)], null
        ));
      }
    }, 200);

    setTimeout(() => {
      rockets.push(new Rocket(canvas.width * 0.25, cy + (Math.random()-0.5)*100,
        FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)], null));
      rockets.push(new Rocket(canvas.width * 0.75, cy + (Math.random()-0.5)*100,
        FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)], null));
    }, 400);

    setTimeout(() => spawnBgWish(w), 300);

    // Ẩn card sau SHOW_MS, rồi gọi onDone
    setTimeout(() => {
      hideWishCard();
      if (onDone) setTimeout(onDone, 200);
    }, SHOW_MS);
  });

  rockets.push(r);
}

function showWishCard(w, color) {
  const card = document.getElementById('wishCard');
  const av   = document.getElementById('cardAvatar');
  document.getElementById('cardName').textContent = w.name;
  document.getElementById('cardWish').textContent = '"' + w.wish + '"';

  av.innerHTML = '';
  if (w.photo) {
    const img = document.createElement('img');
    img.src = w.photo;
    img.onerror = () => { av.textContent = '🌟'; };
    av.appendChild(img);
  } else {
    av.textContent = '🌟';
  }

  card.classList.remove('hide');
  card.classList.add('show');
}

function hideWishCard() {
  const card = document.getElementById('wishCard');
  card.classList.remove('show');
  card.classList.add('hide');
}

function spawnBgWish(w) {
  const div = document.createElement('div');
  div.className = 'bg-wish';
  div.style.left = (5 + Math.random() * 85) + 'vw';
  div.style.top  = (60 + Math.random() * 30) + 'vh';

  const avDiv = document.createElement('div');
  avDiv.className = 'bg-avatar';
  if (w.photo) {
    const img = document.createElement('img');
    img.src = w.photo;
    img.onerror = () => { avDiv.textContent = '✨'; };
    avDiv.appendChild(img);
  } else {
    avDiv.textContent = '✨';
  }

  const nameDiv = document.createElement('div');
  nameDiv.className = 'bg-name';
  nameDiv.textContent = w.name;

  const textDiv = document.createElement('div');
  textDiv.className = 'bg-text';
  textDiv.textContent = w.wish.length > 60 ? w.wish.slice(0, 60) + '…' : w.wish;

  div.append(avDiv, nameDiv, textDiv);
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 9000);
}

// ── Controls ──────────────────────────────────────────────────────
function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ Tiếp tục' : '⏸ Tạm dừng';
  if (!paused && !showing && !replayActive) processQueue();
}

async function replayAll() {
  await fetchWishes();
  if (!wishes.length) return;

  // Reset state
  stopReplay(true); // dừng nhẹ, không ẩn bar ngay
  queue   = [];
  showing = false;
  paused  = false;
  document.getElementById('pauseBtn').textContent = '⏸ Tạm dừng';

  // Chuẩn bị replay
  replayQueue  = [...wishes].sort((a, b) => a.time.localeCompare(b.time));
  replayTotal  = replayQueue.length;
  replayIndex  = 0;
  replayActive = true;

  document.getElementById('replayBar').classList.add('active');
  updateReplayBar(0, replayTotal);

  runReplay();
}

function stopReplay(silent = false) {
  replayActive = false;
  replayQueue  = [];
  if (!silent) {
    document.getElementById('replayBar').classList.remove('active');
    document.getElementById('replayFill').style.width = '0%';
    hideWishCard();
    showing = false;
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

document.addEventListener('dblclick', toggleFullscreen);

// ── Start ──────────────────────────────────────────────────────────
fetchWishes();
pollTimer = setInterval(fetchWishes, POLL_MS);
setTimeout(() => { for (let i = 0; i < 3; i++) setTimeout(ambientFirework, i * 600); }, 500);
</script>
</body>
</html>
